     латиница из одного файла, есть строчные (ники игроков не ломаются).
     Наклон делается transform-ом, как и раньше.

       <link href="https://fonts.googleapis.com/css2?family=Oswald…" rel="stylesheet">

     части провайдеров), первый экран не появляется вовсе. Отчёт игрока, ровно через три дня после того, как ссылка уехала в прод:
