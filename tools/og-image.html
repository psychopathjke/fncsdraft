<!doctype html>
<!-- Превью ссылки 1200×630 (og:image). Пересобрать: node tools/build-og-image.js -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Oswald;src:url(../fonts/oswald-latin.woff2) format('woff2');font-weight:200 700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b1a4a}
body{font-family:Oswald,'Segoe UI',sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:linear-gradient(115deg,#13296f 0%,#0f2160 52%,#0a1748 100%)}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 60px,transparent 60px 150px)}
.art{position:absolute;right:0;top:0;width:560px;height:630px;background:url(../art/fncs-2026-major1.jpg) 62% center/cover;
  clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)}
.art:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,26,74,.55),transparent 40%)}
.l{position:absolute;left:64px;top:44px;width:640px}
.brand{display:flex;align-items:center;gap:14px;font-size:38px;font-weight:700;font-style:italic;letter-spacing:.5px}
.brand img{width:62px;height:62px}.brand i{color:#7ff0dd}
h1{margin-top:26px;font-size:70px;line-height:.98;font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.5px}
h1 b{color:#8fd8ff;font-weight:700}
.daily{margin-top:22px;display:inline-flex;align-items:center;gap:14px;padding:12px 20px 12px 16px;border-radius:14px;
  background:rgba(255,210,63,.12);border:2px solid rgba(255,210,63,.65)}
.daily em{font-style:normal;background:#ffd23f;color:#111;font-weight:700;font-size:20px;padding:4px 10px;border-radius:8px;letter-spacing:1px}
.daily span{font-family:'Segoe UI',sans-serif;font-size:23px;color:#eef3ff}
.chips{margin-top:22px;display:flex;gap:12px}
.chips span{font-size:21px;font-weight:600;letter-spacing:1px;padding:7px 18px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07)}
.chips span.on{background:#ffd23f;color:#111;border-color:#ffd23f}
.url{position:absolute;left:64px;bottom:26px;font-family:'Segoe UI',sans-serif;font-size:21px;color:#9fb3e6}
</style></head><body>
<div class="bg"></div><div class="stripes"></div><div class="art"></div>
<div class="l">
  <div class="brand"><img src="../logo.png" alt="">FNCS <i>DRAFT</i></div>
  <h1>Go pro.<br>Run a club.<br><b>Draft the daily.</b></h1>
  <div class="daily"><em>NEW</em><span>Daily Draft — one season a day, one try, one board</span></div>
  <div class="chips"><span class="on">CAREER</span><span>MANAGER</span><span>DRAFT</span><span>DAILY</span></div>
</div>
<div class="url">fncsdraft.com</div>
</body></html>
