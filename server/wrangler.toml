name = "fncsdraft-mp"
main = "src/worker.js"
compatibility_date = "2026-08-26"

# Свой поддомен вместо *.workers.dev: workers.dev в РФ блокируют целиком,
# и дуо-карьера оттуда не подключалась. Старый адрес продолжает работать.
# ВАЖНО: top-level ключи в TOML должны стоять ДО первой [[секции]].
routes = [
  { pattern = "mp.fncsdraft.com", custom_domain = true }
]

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

# Общая таблица карьер (2.10): один объект на сайт, строки в SQLite. См. src/board.js.
[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Board"]

# Облачные сохранения (16.10): один объект на код-ключ, сейвы кусками в его SQLite. См. src/vault.js.
[[durable_objects.bindings]]
name = "VAULT"
class_name = "Vault"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Vault"]
