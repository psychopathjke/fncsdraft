<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — FNCS Draft</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<!--
  Without this file Cloudflare Pages answers every unknown path with index.html
  and a 200, which is single-page-app behaviour and wrong for a site that is one
  page and a folder of assets: a mistyped image came back as four megabytes of
  HTML that the browser then failed to decode, so a missing file looked like a
  broken picture rather than a missing file. With it, a 404 is a 404.
-->
<style>
  :root{
    --ink:#eaf5f3; --dim:#8ea6a3; --line:rgba(160,200,195,.18);
    --ground:#0b0f12; --panel:#121a20; --accent:#12d3a7;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box{
    width:100%; max-width:560px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:28px 26px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }
  .code{
    font-weight:800; letter-spacing:.08em; font-size:13px;
    color:var(--accent); text-transform:uppercase; margin:0 0 10px;
  }
  h1{margin:0 0 10px; font-size:26px; line-height:1.2; font-weight:800; text-wrap:balance;}
  p{margin:0 0 8px; color:var(--dim);}
  p.ru{margin-bottom:22px;}
  a.home{
    display:inline-block; margin-top:6px; padding:11px 18px; border-radius:10px;
    background:var(--accent); color:#04231c; font-weight:800; text-decoration:none;
  }
  a.home:focus-visible{outline:3px solid #fff; outline-offset:2px;}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px;
    background:rgba(200,225,220,.10); padding:2px 6px; border-radius:6px; color:var(--ink);
    word-break:break-all;
  }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>There is nothing at this address</h1>
    <p>The page or file you asked for is not on this site.</p>
    <p class="ru">Такой страницы или файла здесь нет.</p>
    <p><code id="what"></code></p>
    <a class="home" href="/">FNCS Draft</a>
  </div>
<script>
  var el = document.getElementById('what');
  if (el) el.textContent = location.pathname;
</script>
</body>
</html>
